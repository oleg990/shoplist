name: server-ci
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shoplist
          POSTGRES_PASSWORD: shoplist
          POSTGRES_DB: shoplist_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shoplist" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://shoplist:shoplist@localhost:5432/shoplist_test?sslmode=disable
