name: server-image

# Собирает образ сервера и кладёт его в GitHub Container Registry при каждом изменении в main.
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shoplist-server:latest
            ghcr.io/${{ github.repository_owner }}/shoplist-server:${{ github.sha }}
