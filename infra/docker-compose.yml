# Локальная разработка: make dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoplist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoplist}
      POSTGRES_DB: ${POSTGRES_DB:-shoplist}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoplist}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ../server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-shoplist}:${POSTGRES_PASSWORD:-shoplist}@postgres:5432/${POSTGRES_DB:-shoplist}?sslmode=disable
      HTTP_ADDR: ":8080"
      # Только для разработки. В проде: JWT_SECRET (openssl rand -hex 32), APP_ENV=production.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
